detector: yolov8_custom
distance_method: analytic_geometry
img_size: 640
batch_size: 16
epochs: 50
lr: 0.0001
weight_decay: 0.0005
optimizer: AdamW
seed: 0
train_split: splits/kitti_train.txt
val_split: splits/kitti_val.txt
kitti_root: /data/kitti/training
augmentation:
  hflip: false
  strong_aug: false
  mosaic: false
gt_source: annotation_bottom_center
