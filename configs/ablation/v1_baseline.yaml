# V1: Baseline — detection + direct depth only (no sec θ, no contact point)
# Inherits: _base.yaml
kitti_root: /media/truong/01DBB45ECE0C4E00/dl/kitti_object/training
train_split: /media/truong/01DBB45ECE0C4E00/dl/kitti_object/splits/distformer_train.txt
